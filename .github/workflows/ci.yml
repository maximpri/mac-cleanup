name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the locked macOS dependency license graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          rust-version: "1.88.0"
          arguments: --locked
          command: check licenses

  quality:
    name: Format, lint, test, and package
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Lint
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo +stable test --all-targets --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --document-private-items --locked

      - name: Build Rust and Apple AI release bundle
        run: RUSTUP_TOOLCHAIN=stable sh scripts/build-release.sh

      - name: Exercise the terminal on disposable fixtures
        timeout-minutes: 5
        run: python3 scripts/smoke_tui.py target/release/diskray

      - name: Check Apple helper protocol
        run: python3 scripts/check_ai_helper.py

      - name: Check MCP server
        run: python3 scripts/check_mcp.py target/release/diskray

      - name: Test eval safety assertions without Apple Intelligence
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check eval safety rules (quality needs Apple Intelligence)
        run: python3 scripts/eval_agent.py target/release/diskray --runs 1

      - name: Validate bundled rule packs
        run: for pack in rules/*.toml rules/*/*.toml; do ./target/release/diskray rules check "$pack"; done

      - name: Validate source package
        run: cargo +stable package --locked

  msrv:
    name: Minimum Rust 1.88
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check minimum supported Rust version
        run: cargo +1.88.0 check --all-targets --locked
