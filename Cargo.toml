[package]
name = "diskray"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "An X-ray for your Mac's disk: understand storage and activity before you delete anything"
authors = ["Maxim Priezjev"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/maximpri/diskray"
homepage = "https://github.com/maximpri/diskray"
keywords = ["macos", "disk", "storage", "tui", "apple-intelligence"]
categories = ["command-line-utilities"]
# Distributed from source through GitHub and the Homebrew tap; never uploaded
# to crates.io by accident.
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
# Pinned because wrapped-dialog measurement uses rendered-line-info.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
trash = { version = "5.2.9", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
